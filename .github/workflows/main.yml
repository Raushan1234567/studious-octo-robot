
name: Full Stack CI and Docker Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  backend-build:
    name: Backend Maven Build
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Verify backend project
      - name: Verify backend project
        run: test -f "BackendSetup/demo (4)/demo/pom.xml"

      # 4. Maven build and test
      - name: Maven Build and Test
        working-directory: BackendSetup/demo (4)/demo
        run: |
          chmod +x mvnw
          ./mvnw clean verify

      # 5. Set lowercase Docker image name
      - name: Set Docker image name
        if: github.event_name == 'push'
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # 6. Login to GHCR
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 7. Build and publish Docker image
      - name: Build and Publish Backend Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: BackendSetup/demo (4)/demo
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
