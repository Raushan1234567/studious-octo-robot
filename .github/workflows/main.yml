
name: Full Stack CI and Docker Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  backend-build:
    name: Backend Maven Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify backend project
        run: test -f "BackendSetup/demo (4)/demo/pom.xml"

      - name: Maven Build and Test
        working-directory: BackendSetup/demo (4)/demo
        run: |
          chmod +x mvnw
          ./mvnw clean verify

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Publish Backend Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: BackendSetup/demo (4)/demo
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
