
name: Full Stack CI and Docker Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  backend-build:
    name: Backend Build and Docker Test
    runs-on: ubuntu-latest

    # Temporary PostgreSQL database for container testing
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tasks
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tasks"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify backend project
        run: test -f "BackendSetup/demo-4/demo/pom.xml"

      - name: Maven Build and Test
        working-directory: BackendSetup/demo-4/demo
        run: |
          chmod +x mvnw
          ./mvnw clean verify

      # NEW: Build Docker image locally
      - name: Build Backend Docker Image
        working-directory: BackendSetup/demo-4/demo
        run: docker build -t backend-test:ci .

      # NEW: Start backend container
      - name: Run Backend Container
        run: |
          docker run -d \
            --name backend-test \
            -p 8080:8080 \
            --add-host=host.docker.internal:host-gateway \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/tasks \
            -e SPRING_DATASOURCE_USERNAME=postgres \
            -e SPRING_DATASOURCE_PASSWORD=postgres \
            backend-test:ci

      # NEW: Check whether API is responding
      - name: Test Backend API
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/api/tasks; then
              echo "Backend API is working!"
              exit 0
            fi
            echo "Waiting for backend..."
            sleep 3
          done

          echo "Backend failed to start or API test failed"
          docker logs backend-test
          exit 1

      # NEW: Cleanup test container
      - name: Cleanup Test Container
        if: always()
        run: docker rm -f backend-test || true

      # EXISTING: Set lowercase Docker image name
      - name: Set Docker image name
        if: github.event_name == 'push'
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # EXISTING: Login to GHCR
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # EXISTING: Build and publish Docker image
      - name: Build and Publish Backend Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: BackendSetup/demo-4/demo
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
