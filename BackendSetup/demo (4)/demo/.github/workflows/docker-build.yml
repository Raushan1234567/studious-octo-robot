
name: Build Spring Boot Docker Image

on:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t springboot-backend:latest .

      - name: Verify Docker image
        run: docker images
